---
# Connect an existing WordPress site to WordSail by writing the connector
# plugin's connection key into wp-config.php.
#
# Required variables (pass via --extra-vars):
#   site_id                  Site identifier (also the system user)
#   site_domain              Primary domain of the site (site_home is /sites/<site_domain>)
#   wordsail_connection_key  Connection key issued by WordSail for this site
#
# Sets the WORDSAIL_CONNECTION_KEY constant via WP-CLI, so it is added if
# missing and updated if it already exists (safe to re-run, e.g. to rotate).
- name: Connect WordSail Connector Plugin
  hosts: all:!localhost
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    site_user: '{{ site_id }}'
    site_home: '/sites/{{ site_domain }}'

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - site_id is defined and site_id | length > 0
          - site_domain is defined and site_domain | length > 0
          - wordsail_connection_key is defined and wordsail_connection_key | length > 0
        fail_msg: |
          Required variables are missing or empty. Please provide:
            - site_id: Site identifier
            - site_domain: Domain name of the site
            - wordsail_connection_key: Connection key issued by WordSail
          Pass these via --extra-vars
      no_log: true

  tasks:
    - name: Check that wp-config.php exists
      ansible.builtin.stat:
        path: '{{ site_home }}/files/wp-config.php'
      register: wp_config_stat

    - name: Fail if wp-config.php is missing
      ansible.builtin.fail:
        msg: 'wp-config.php not found at {{ site_home }}/files/wp-config.php'
      when: not wp_config_stat.stat.exists

    - name: Get current WORDSAIL_CONNECTION_KEY
      become_user: '{{ site_user }}'
      ansible.builtin.command:
        argv: [wp, config, get, WORDSAIL_CONNECTION_KEY, --type=constant]
        chdir: '{{ site_home }}/files'
      register: current_connection_key
      failed_when: false
      changed_when: false
      no_log: true

    - name: Set WORDSAIL_CONNECTION_KEY in wp-config.php
      become_user: '{{ site_user }}'
      ansible.builtin.command:
        argv:
          - wp
          - config
          - set
          - WORDSAIL_CONNECTION_KEY
          - '{{ wordsail_connection_key }}'
          - --type=constant
        chdir: '{{ site_home }}/files'
      when: current_connection_key.rc != 0 or current_connection_key.stdout | trim != wordsail_connection_key
      no_log: true
