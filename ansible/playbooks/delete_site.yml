---
- name: Delete WordPress Site
  hosts: webservers
  become: true
  vars:
    db_name: '{{ site_id }}'
    db_user: '{{ site_id }}'
    site_user: '{{ site_id }}'
    site_group: '{{ site_id }}'
    site_home: '/sites/{{ site_domain }}'

  pre_tasks:
    # Accept the same "domain" variable used by website.yml so the cron entry
    # (named wp-cron-{{ domain }} at creation) is removed consistently.
    - name: Resolve site_domain from domain
      ansible.builtin.set_fact:
        site_domain: '{{ domain }}'
      when: domain is defined and domain | length > 0

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - site_id is defined and site_id | length > 0
          - site_domain is defined and site_domain | length > 0
          - db_host is defined and db_host | length > 0
        fail_msg: |
          Required variables are missing or empty. Please provide:
            - site_id: Site identifier
            - site_domain: Domain name of the site to delete (or pass domain)
            - db_host: Database host (e.g., localhost or localhost:3306)
          Pass these via --extra-vars

  tasks:
    - name: Remove cron job
      ansible.builtin.cron:
        name: 'wp-cron-{{ site_domain }}'
        user: '{{ site_user }}'
        state: absent
      ignore_errors: true

    - name: Remove WordPress files
      ansible.builtin.file:
        path: '{{ site_home }}/files'
        state: absent

    - name: Drop MySQL database
      community.mysql.mysql_db:
        name: '{{ db_name }}'
        state: absent
        login_host: "{{ db_host.split(':')[0] }}"
        login_port: "{{ db_host.split(':')[1] | default('3306') }}"
        config_file: /home/pressctl/.my.cnf
      ignore_errors: true

    - name: Drop MySQL user
      community.mysql.mysql_user:
        name: '{{ db_user }}'
        host_all: true
        state: absent
        login_host: "{{ db_host.split(':')[0] }}"
        login_port: "{{ db_host.split(':')[1] | default('3306') }}"
        config_file: /home/pressctl/.my.cnf
      ignore_errors: true

    - name: Remove site directories
      ansible.builtin.file:
        path: '{{ site_home }}'
        state: absent

    - name: Remove Nginx site configuration
      ansible.builtin.file:
        path: '/etc/nginx/sites-enabled/{{ site_domain }}'
        state: absent
      notify: Reload nginx

    - name: Remove Nginx site directory
      ansible.builtin.file:
        path: '/etc/nginx/sites-available/{{ site_domain }}'
        state: absent
      notify: Reload nginx

    - name: Remove the pool settings file
      ansible.builtin.file:
        path: '/etc/pressctl/pool-includes/{{ site_id }}.conf'
        state: absent

    - name: Remove PHP-FPM pool configuration
      ansible.builtin.file:
        path: '/etc/php/{{ php_version | default("8.3") }}/fpm/pool.d/{{ site_id }}.conf'
        state: absent

    - name: Reload PHP-FPM to release site user
      ansible.builtin.service:
        name: php{{ php_version | default('8.3') }}-fpm
        state: reloaded
      changed_when: true

    - name: Remove the site's web logs, log rotation and page cache
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '/var/log/pressctl/sites/{{ site_domain }}'
        - '/etc/logrotate.d/pressctl-site-{{ site_domain }}'
        - '/cache/{{ site_domain }}'

    - name: Remove the site's Redis account
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '/etc/pressctl/redis/users.d/{{ site_id }}.acl'
        - '/etc/pressctl/redis/{{ site_id }}.pass'
      register: site_redis_removed

    - name: Reload the Redis accounts without the site
      ansible.builtin.shell: |
        set -eu
        [ -d /etc/pressctl/redis/users.d ] || exit 0
        umask 027
        cat /etc/pressctl/redis/users.d/*.acl > /etc/redis/sites-users.acl.new
        chgrp redis /etc/redis/sites-users.acl.new
        mv /etc/redis/sites-users.acl.new /etc/redis/sites-users.acl
        REDISCLI_AUTH="$(cat /etc/pressctl/redis/admin.pass)" \
          redis-cli -s /run/redis-sites/redis.sock --user pressctl-admin ACL LOAD
      when: site_redis_removed.changed
      no_log: true

    - name: Remove site user
      ansible.builtin.user:
        name: '{{ site_user }}'
        state: absent
        remove: true

    - name: Remove site group
      ansible.builtin.group:
        name: '{{ site_group }}'
        state: absent
      ignore_errors: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Reload php-fpm
      ansible.builtin.service:
        name: php{{ php_version | default('8.3') }}-fpm
        state: reloaded
