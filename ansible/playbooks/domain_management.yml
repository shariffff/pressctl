---
# Main playbook for domain management operations
- hosts: all
  gather_facts: false
  become: true
  vars:
    domain_config_path: "/etc/nginx/sites-available"
    domain_enabled_path: "/etc/nginx/sites-enabled"
    ssl_cert_path: "/etc/letsencrypt/live"

  pre_tasks:
    - name: Validate operation variable
      ansible.builtin.assert:
        that:
          - operation is defined and operation | length > 0
          - operation in ['add_domain', 'remove_domain', 'issue_ssl']
        fail_msg: |
          Invalid or missing operation. Please provide:
            - operation: One of 'add_domain', 'remove_domain', or 'issue_ssl'
          Pass via --extra-vars "operation=add_domain"

  tasks:
    # Traditional (Nginx + Certbot) operations
    - name: Add domain to Nginx
      ansible.builtin.include_role:
        name: libs
        tasks_from: add_domain.yml
      when:
        - operation == 'add_domain'
        - stack | default('traditional') == 'traditional'
      tags: add_domain

    - name: Remove domain from Nginx
      ansible.builtin.include_role:
        name: libs
        tasks_from: remove_domain.yml
      when:
        - operation == 'remove_domain'
        - stack | default('traditional') == 'traditional'
      tags: remove_domain

    - name: Issue SSL certificate
      ansible.builtin.include_role:
        name: libs
        tasks_from: issue_ssl.yml
      when:
        - operation == 'issue_ssl'
        - stack | default('traditional') == 'traditional'
      tags: issue_ssl

    - name: Reload Nginx configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when:
        - stack | default('traditional') == 'traditional'
        - nginx_config_changed is defined and nginx_config_changed
      tags:
        - add_domain
        - remove_domain
        - issue_ssl

    # FrankenPHP (Caddy) operations — TLS is automatic, issue_ssl is a no-op
    - name: Add domain to FrankenPHP
      ansible.builtin.include_role:
        name: libs
        tasks_from: add_domain_frankenphp.yml
      when:
        - operation == 'add_domain'
        - stack | default('traditional') == 'frankenphp'
      tags: add_domain

    - name: Remove domain from FrankenPHP
      ansible.builtin.include_role:
        name: libs
        tasks_from: remove_domain_frankenphp.yml
      when:
        - operation == 'remove_domain'
        - stack | default('traditional') == 'frankenphp'
      tags: remove_domain

    - name: SSL is automatic on FrankenPHP (no action)
      ansible.builtin.debug:
        msg: "FrankenPHP serves TLS automatically via Caddy; no Certbot issuance needed for {{ domain }}."
      when:
        - operation == 'issue_ssl'
        - stack | default('traditional') == 'frankenphp'
      tags: issue_ssl
