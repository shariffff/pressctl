---
# Docker Role Tasks
# Installs Docker Engine and the Compose plugin from Docker's official apt repo.
# Used by the FrankenPHP stack to run the site-serving container.

- name: Install Docker apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  register: docker_prereqs
  until: docker_prereqs is success
  retries: 3
  delay: 5

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  register: docker_key
  until: docker_key is success
  retries: 3
  delay: 5

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch | default(ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64')) }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
    update_cache: true
  register: docker_repo
  until: docker_repo is success
  retries: 3
  delay: 5

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  register: docker_install
  until: docker_install is success
  retries: 3
  delay: 5

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add pressctl user to docker group
  ansible.builtin.user:
    name: pressctl
    groups: docker
    append: true
