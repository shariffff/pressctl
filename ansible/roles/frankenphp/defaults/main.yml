---
# FrankenPHP Role Defaults
# These can be overridden in group_vars/all.yml or via --extra-vars.

# How the FrankenPHP runtime is deployed:
#   native : the FrankenPHP static binary run under systemd directly on the host
#            (no Docker daemon). Recommended for the single-VPS model — keeps the
#            operational model consistent with the rest of the stack.
#   docker : a Docker container (built from the upstream FrankenPHP image) serving
#            all sites. Reaches the host MariaDB over the Docker host gateway.
frankenphp_runtime: native

# Base directory holding the FrankenPHP Caddyfile, per-site configs and (docker
# only) the compose file. Shared by both runtimes.
frankenphp_dir: /etc/frankenphp

# Directory holding one <domain>.caddy file per site. Imported by the base
# Caddyfile. Bind-mounted into the container on the docker runtime.
frankenphp_sites_dir: "{{ frankenphp_dir }}/sites"

# Upstream FrankenPHP image, pinned to the requested PHP version
frankenphp_base_image: "dunglas/frankenphp:php{{ php_version }}"

# Locally built image tag (adds WordPress PHP extensions + WP-CLI)
frankenphp_image: "pressctl/frankenphp:php{{ php_version }}"

# Compose service / container name (docker runtime)
frankenphp_service: frankenphp
frankenphp_container_name: pressctl-frankenphp
frankenphp_compose_file: "{{ frankenphp_dir }}/docker-compose.yml"

# ── Native runtime settings ──────────────────────────────────────────────────
# The native runtime installs FrankenPHP from the static-php Debian repository
# (pkg.henderkes.com). The repository is per-PHP-version: php_version "8.3"
# selects the "83" repo (82–85 are published). The deb ships /usr/bin/frankenphp,
# a systemd unit with graceful reload, and creates the frankenphp user/group.
frankenphp_repo_version: "{{ php_version | replace('.', '') }}"
frankenphp_repo_url: "https://pkg.henderkes.com/api/packages/{{ frankenphp_repo_version }}/debian"
frankenphp_repo_key_path: "/etc/apt/keyrings/static-php{{ frankenphp_repo_version }}.asc"

# System user/group the FrankenPHP process runs as. Created by the deb package
# postinst (home: /var/lib/frankenphp). A single shared runtime serves every
# site, so this user owns the site files of native-FrankenPHP sites.
frankenphp_user: frankenphp
frankenphp_group: frankenphp

# Binary locations (native runtime). frankenphp and php-zts come from the deb
# packages; wp.phar/wp-franken are installed by this role.
frankenphp_bin: /usr/bin/frankenphp
frankenphp_php_bin: /usr/bin/php-zts
frankenphp_wp_phar: /usr/local/bin/wp.phar
frankenphp_wp_wrapper: /usr/local/bin/wp-franken

# PHP configuration directory used by both the frankenphp server and the
# php-zts CLI (single shared php.ini — no per-SAPI split like PHP-FPM has).
frankenphp_php_ini_dir: /etc/php-zts

# Extra ini scan directory loaded ONLY by the frankenphp server process, via
# PHP_INI_SCAN_DIR (systemd drop-in on native, container environment on docker).
# Holds php_disabled_functions — hardening that can't go in the shared ini dir
# because it would also apply to the php-zts CLI and break WP-CLI. Used by both
# runtimes (bind-mounted into the container on docker).
frankenphp_server_ini_dir: "{{ frankenphp_dir }}/php.d"

# Compile-time ini scan dir of the upstream FrankenPHP Docker image (official
# php image layout). WP-CLI execs inside the container reset PHP_INI_SCAN_DIR
# to this value so they load the stock conf.d without the server-only dir above.
frankenphp_docker_ini_scan_dir: /usr/local/etc/php/conf.d

# systemd unit name (native runtime, shipped by the deb package)
frankenphp_systemd_unit: frankenphp

# PHP extensions installed as php-zts-<name> packages (native runtime).
# curl, exif, mbstring, opcache, openssl, xml, zip's deps etc. are compiled into
# the base package — only list extensions published as separate packages.
frankenphp_zts_extensions:
  - bcmath
  - gd
  - igbinary
  - imagick
  - intl
  - mysqli
  - pdo-mysql
  - redis
  - soap
  - zip

# Extra PHP extensions installed via PIE (https://github.com/php/pie) for
# anything not packaged as php-zts-<name>. Entries are Composer-style package
# specs, e.g. "asgrim/example-pie-extension".
frankenphp_pie_extensions: []

# PHP extensions installed into the image via install-php-extensions (docker
# runtime only). Mirrors the host php_extensions list (group_vars/all.yml)
# minus fpm/cli which are not applicable to the FrankenPHP runtime.
frankenphp_php_extensions:
  - bcmath
  - exif
  - gd
  - igbinary
  - imagick
  - intl
  - mysqli
  - opcache
  - pdo_mysql
  - redis
  - soap
  - zip
