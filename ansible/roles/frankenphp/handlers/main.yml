---
# Two topics, dispatched per runtime:
#   reload frankenphp  : Caddy config changed — the native deb unit supports a
#                        graceful zero-downtime reload (frankenphp reload).
#   restart frankenphp : the process itself must be replaced (package upgrade,
#                        php.ini change, new extension) — full restart.
# The docker runtime has no graceful path, so both topics restart the container.

- name: reload frankenphp (native)
  ansible.builtin.systemd:
    name: "{{ frankenphp_systemd_unit }}"
    state: reloaded
  when: frankenphp_runtime | default('native') == 'native'
  listen: reload frankenphp

- name: restart frankenphp (native)
  ansible.builtin.systemd:
    name: "{{ frankenphp_systemd_unit }}"
    state: restarted
    daemon_reload: true
  when: frankenphp_runtime | default('native') == 'native'
  listen: restart frankenphp

- name: restart frankenphp (docker)
  ansible.builtin.command:
    cmd: docker compose -f {{ frankenphp_compose_file }} restart {{ frankenphp_service }}
  changed_when: true
  when: frankenphp_runtime | default('native') == 'docker'
  listen:
    - reload frankenphp
    - restart frankenphp
