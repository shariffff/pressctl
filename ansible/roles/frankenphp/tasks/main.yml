---
# FrankenPHP Role Tasks
# Sets up the FrankenPHP runtime that serves all sites on this server. TLS is
# handled automatically by Caddy. Two runtimes are supported (frankenphp_runtime):
#   native : the FrankenPHP deb package (static-php repo) under systemd
#   docker : a container built from the upstream FrankenPHP image
# The Caddyfile and per-site config layout are identical for both.

# ── Shared layout (both runtimes) ────────────────────────────────────────────
- name: Create FrankenPHP directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ frankenphp_dir }}"
    - "{{ frankenphp_sites_dir }}"
    - "{{ frankenphp_server_ini_dir }}"

# Server-only PHP hardening (disable_functions). The shared ini dir can't carry
# this (it would break WP-CLI), so the server process gets an extra scan dir via
# PHP_INI_SCAN_DIR: a systemd drop-in on native, container env on docker.
- name: Deploy server-only PHP hardening (disable_functions)
  ansible.builtin.template:
    src: php-server-hardening.ini.j2
    dest: "{{ frankenphp_server_ini_dir }}/99-pressctl-hardening.ini"
    owner: root
    group: root
    mode: "0644"
  notify: restart frankenphp

# Per-site resource summary from the Caddy access logs. The logs live on the
# host for both runtimes (/sites is bind-mounted into the container on docker).
- name: Install jq (used by press-sitestats)
  ansible.builtin.apt:
    name:
      - jq
      - bsdextrautils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy per-site resource summary helper (press-sitestats)
  ansible.builtin.template:
    src: press-sitestats.sh.j2
    dest: /usr/local/bin/press-sitestats
    owner: root
    group: root
    mode: "0755"

- name: Deploy placeholder site config (keeps Caddyfile import glob non-empty)
  ansible.builtin.copy:
    dest: "{{ frankenphp_sites_dir }}/.keep.caddy"
    content: "# Placeholder so 'import {{ frankenphp_sites_dir }}/*.caddy' always matches.\n"
    owner: root
    group: root
    mode: "0644"

- name: Deploy base Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ frankenphp_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: reload frankenphp

# ── Native runtime: deb package (static-php repo) + systemd ──────────────────
- name: Set up native FrankenPHP runtime
  ansible.builtin.include_tasks: native.yml
  when: frankenphp_runtime | default('native') == 'native'

# ── Docker runtime: image build + compose ────────────────────────────────────
- name: Set up Docker FrankenPHP runtime
  ansible.builtin.include_tasks: docker.yml
  when: frankenphp_runtime | default('native') == 'docker'
