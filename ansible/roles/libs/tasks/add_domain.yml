---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - domain is defined and domain != ""
      - site_id is defined and site_id != ""
      # Used in root file paths and nginx config: plain domain names only.
      - domain is match('^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$')
      - site_id is match('^[a-z0-9]{3,16}$')
    fail_msg: "domain (a plain lowercase domain name) and site_id (3-16 lowercase letters or digits) are required for add_domain"
    success_msg: "All required variables are properly defined"
  tags: add_domain

- name: Create site directory structure
  ansible.builtin.file:
    path: "/etc/nginx/sites-available/{{ domain }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - ""
    - after
    - before
    - location
    - server
  tags: add_domain

- name: Remove existing https-redirect.conf if present (prevents port 80 conflict)
  ansible.builtin.file:
    path: "/etc/nginx/sites-available/{{ domain }}/after/https-redirect.conf"
    state: absent
  tags: add_domain

# /sites is root-owned, so root may look at the site's home; anything inside
# it belongs to the site user and is created as that user (root following a
# link the user left at ~/logs would hand them whatever it points at).
- name: Check for the site's home
  ansible.builtin.stat:
    path: "/sites/{{ domain }}"
    follow: false
  register: add_domain_site_home
  tags: add_domain

- name: Ensure site logs directory exists (PHP's own error log)
  become_user: "{{ site_id if add_domain_site_home.stat.exists else 'root' }}"
  ansible.builtin.file:
    path: "/sites/{{ domain }}/logs"
    state: directory
    owner: "{{ site_id }}"
    group: "{{ site_id }}"
    mode: "0755"
    follow: false
  tags: add_domain

- name: Set up the site's web log directory and log format
  ansible.builtin.import_tasks: site_web_logs.yml
  vars:
    site_log_domain: "{{ domain }}"
    site_log_group: "{{ site_id }}"
  tags: add_domain

- name: Deploy main site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ domain }}/{{ domain }}
    owner: root
    group: root
    mode: "0644"
  tags: add_domain

- name: Symlink site to sites-enabled
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ domain }}/{{ domain }}
    dest: /etc/nginx/sites-enabled/{{ domain }}
    state: link
  tags: add_domain

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_config_test
  changed_when: false
  tags: add_domain

- name: Fail if nginx configuration is invalid
  ansible.builtin.fail:
    msg: "Nginx configuration test failed: {{ nginx_config_test.stderr }}"
  when: nginx_config_test.rc != 0
  tags: add_domain

- name: Reload nginx after validation
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: nginx_config_test.rc == 0
  tags: add_domain
