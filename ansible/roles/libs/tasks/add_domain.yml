---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - domain is defined and domain != ""
      - site_id is defined and site_id != ""
    fail_msg: "Required variables missing: domain and site_id must be provided for add_domain operation"
    success_msg: "All required variables are properly defined"
  tags: add_domain

- name: Create site directory structure
  ansible.builtin.file:
    path: "/etc/nginx/sites-available/{{ domain }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - ""
    - after
    - before
    - location
    - server
  tags: add_domain

- name: Remove existing https-redirect.conf if present (prevents port 80 conflict)
  ansible.builtin.file:
    path: "/etc/nginx/sites-available/{{ domain }}/after/https-redirect.conf"
    state: absent
  tags: add_domain

- name: Ensure site logs directory exists (PHP's own error log)
  ansible.builtin.file:
    path: "/sites/{{ domain }}/logs"
    state: directory
    owner: "{{ site_id }}"
    group: "{{ site_id }}"
    mode: "0755"
  tags: add_domain

# nginx opens its logs as root, so they live in a root-owned directory the site
# user can read but not change (in a directory the user owns, a log could be
# swapped for a link to a system file). The site's group may read them.
- name: Ensure the root-owned web log directory exists
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/log/pressctl, group: root, mode: "0755" }
    - { path: /var/log/pressctl/sites, group: root, mode: "0711" }
    - { path: "/var/log/pressctl/sites/{{ domain }}", group: "{{ site_id }}", mode: "0750" }
  loop_control:
    label: "{{ item.path }}"
  tags: add_domain

# nginx's workers (www-data) reopen the logs themselves after a rotation
# (USR1), so they need to pass through the directory. Traverse only.
- name: Let nginx's workers reopen the site's web logs
  ansible.posix.acl:
    path: "/var/log/pressctl/sites/{{ domain }}"
    entity: www-data
    etype: user
    permissions: x
    state: present
  tags: add_domain

- name: Deploy main site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ domain }}/{{ domain }}
    owner: root
    group: root
    mode: "0644"
  tags: add_domain

- name: Symlink site to sites-enabled
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ domain }}/{{ domain }}
    dest: /etc/nginx/sites-enabled/{{ domain }}
    state: link
  tags: add_domain

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_config_test
  changed_when: false
  tags: add_domain

- name: Fail if nginx configuration is invalid
  ansible.builtin.fail:
    msg: "Nginx configuration test failed: {{ nginx_config_test.stderr }}"
  when: nginx_config_test.rc != 0
  tags: add_domain

- name: Reload nginx after validation
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: nginx_config_test.rc == 0
  tags: add_domain
