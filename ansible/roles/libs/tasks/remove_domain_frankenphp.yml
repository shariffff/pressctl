---
# Remove an additional domain from a FrankenPHP site: delete its Caddy snippet
# and reload the container.

- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - domain is defined and domain != ""
    fail_msg: "Required variable missing: domain must be provided for remove_domain (frankenphp)"
    success_msg: "All required variables are properly defined"
  tags: remove_domain

- name: Remove Caddy config for domain {{ domain }}
  ansible.builtin.file:
    path: "/etc/frankenphp/sites/{{ domain }}.caddy"
    state: absent
  register: fp_alias_removed
  tags: remove_domain

- name: Reload FrankenPHP container
  ansible.builtin.command:
    cmd: docker compose -f /etc/frankenphp/docker-compose.yml restart frankenphp
  changed_when: true
  when: fp_alias_removed is changed
  tags: remove_domain
