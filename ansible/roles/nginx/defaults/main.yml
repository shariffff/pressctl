---
# Most nginx settings live in group_vars/all.yml. These defaults sit with the
# role so the playbooks under playbooks/ (which don't load group_vars) get them.

# Open files per worker: every site adds its own log files and cache.
nginx_worker_rlimit_nofile: 65535

# Brute-force limit for POSTs to wp-login.php and xmlrpc.php, per visitor.
nginx_login_rate: "10r/m"
nginx_login_burst: 10

# Cloudflare's published edge ranges (https://www.cloudflare.com/ips/).
cloudflare_ip_ranges:
