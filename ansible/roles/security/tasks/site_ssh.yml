---
# Lets site owners sign in over SSH/SFTP as their site user (see the
# 10-site-users.conf.j2 template). Included by main.yml and by
# playbooks/ssh_baseline.yml for servers that already exist.
- name: Create the site-users group
  ansible.builtin.group:
    name: site-users
    state: present

- name: Allow password sign-in for site users only
  ansible.builtin.template:
    src: 10-site-users.conf.j2
    dest: /etc/ssh/sshd_config.d/10-site-users.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart ssh

- name: Check the sshd configuration before it is reloaded
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Tighten the fail2ban sshd jail
  ansible.builtin.template:
    src: pressctl-sshd.local.j2
    dest: /etc/fail2ban/jail.d/pressctl-sshd.local
    owner: root
    group: root
    mode: "0644"
  register: sshd_jail

- name: Restart fail2ban when the jail changed
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
    enabled: true
  when: sshd_jail.changed

# ── The sandbox every site login runs in ──
# A site user's shell is /usr/local/bin/pressctl-shell: a bubblewrap sandbox that shows
# only the site's own directory. Without it a login could read /etc/nginx,
# other tenants' domains, the process list and so on.
- name: Install bubblewrap
  ansible.builtin.apt:
    name: bubblewrap
    state: present

- name: Install the site login shell
  ansible.builtin.copy:
    src: pressctl-shell
    dest: /usr/local/bin/pressctl-shell
    owner: root
    group: root
    mode: "0755"

- name: Check whether AppArmor restricts user namespaces here
  ansible.builtin.stat:
    path: /etc/apparmor.d/abi/4.0
  register: apparmor_abi4

- name: Let bubblewrap create user namespaces (Ubuntu 24.04 and later)
  ansible.builtin.copy:
    src: pressctl-bwrap.apparmor
    dest: /etc/apparmor.d/pressctl-bwrap
    owner: root
    group: root
    mode: "0644"
  register: bwrap_profile
  when: apparmor_abi4.stat.exists

- name: Load the bubblewrap AppArmor profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/pressctl-bwrap
  when: apparmor_abi4.stat.exists and bwrap_profile.changed

- name: Limit processes and sessions for site logins
  ansible.builtin.template:
    src: 50-pressctl-sites.conf.j2
    dest: /etc/security/limits.d/50-pressctl-sites.conf
    owner: root
    group: root
    mode: "0644"

- name: Check that an unprivileged user can start the sandbox
  ansible.builtin.command: >-
    runuser -u nobody -- /usr/bin/bwrap --unshare-user --disable-userns --ro-bind /usr /usr
    --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 /bin/true
  changed_when: false
  when: not ansible_check_mode

- name: Find the existing sites
  ansible.builtin.find:
    paths: /sites
    file_type: directory
    depth: 1
    hidden: false
  register: sandbox_site_dirs

- name: Put every existing site login in the sandbox
  ansible.builtin.user:
    name: "{{ item.pw_name }}"
    shell: /usr/local/bin/pressctl-shell
  loop: "{{ sandbox_site_dirs.files }}"
  loop_control:
    label: "{{ item.pw_name }}"
  when: item.pw_name != 'root'

# ── Memory, task and CPU caps per site user's logins ──
- name: Install the login limits helper
  ansible.builtin.copy:
    src: pressctl-login-limits
    dest: /usr/local/sbin/pressctl-login-limits
    owner: root
    group: root
    mode: "0755"

- name: Cap every existing site user's logins
  ansible.builtin.command: "/usr/local/sbin/pressctl-login-limits {{ item.pw_name }}"
  environment:
    NO_RELOAD: "1"
  loop: "{{ sandbox_site_dirs.files }}"
  loop_control:
    label: "{{ item.pw_name }}"
  when: item.pw_name != 'root'
  register: login_limits
  changed_when: false

- name: Reload systemd so the new limits apply
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

# ── Site users must not reach the local Redis / MariaDB over TCP ──
# A login shares the host's network, so 127.0.0.1:6379 (Redis, no password,
# used only by the server's own tools) and 127.0.0.1:3306 were open to every
# site user and to PHP. WordPress reaches MariaDB through its unix socket, so
# nothing legitimate loses access. Site users are uid >= 1001 (1000 is the
# ansible user). The rule goes before ufw's "accept everything on lo" line.
- name: Block site users from local Redis and MariaDB over TCP (IPv4)
  ansible.builtin.blockinfile:
    path: /etc/ufw/before.rules
    marker: "# {mark} pressctl: keep site users off local redis/mariadb"
    insertbefore: '^-A ufw-before-output -o lo -j ACCEPT'
    block: |
      -A ufw-before-output -o lo -p tcp -m multiport --dports 6379,3306 -m owner --uid-owner 1001-59999 -j REJECT --reject-with tcp-reset
    validate: "iptables-restore --test --noflush %s"
  register: ufw_v4_rule

- name: Block site users from local Redis and MariaDB over TCP (IPv6)
  ansible.builtin.blockinfile:
    path: /etc/ufw/before6.rules
    marker: "# {mark} pressctl: keep site users off local redis/mariadb"
    insertbefore: '^-A ufw6-before-output -o lo -j ACCEPT'
    block: |
      -A ufw6-before-output -o lo -p tcp -m multiport --dports 6379,3306 -m owner --uid-owner 1001-59999 -j REJECT --reject-with tcp-reset
    validate: "ip6tables-restore --test --noflush %s"
  register: ufw_v6_rule

- name: Load the new firewall rules
  ansible.builtin.command: ufw reload
  when: (ufw_v4_rule.changed or ufw_v6_rule.changed) and not ansible_check_mode
  changed_when: true
