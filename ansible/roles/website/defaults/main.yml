---
# Website Role - Default Variables
# Override these in group_vars/all.yml, via --extra-vars, or per-site

# PHP-FPM Pool Configuration (per-site settings)
# Process manager mode: static, dynamic, or ondemand
site_php_pm: "dynamic"
site_php_pm_max_children: 5
site_php_pm_start_servers: 1
site_php_pm_min_spare_servers: 1
site_php_pm_max_spare_servers: 1
site_php_pm_max_requests: 500
site_php_pm_process_idle_timeout: "10s"

# WordPress Configuration (locale and auto-updates set in group_vars/all.yml)
wp_debug: false
wp_debug_log: false
wp_debug_display: false

# WordSail connector plugin (installed and activated after WordPress install)
# Set false to skip
wordsail_connector_enabled: true
wordsail_connector_url: "https://managed.wordsail.com/api/connector/v1/plugin/download/wordsail-connector-latest.zip"

# Cron Configuration
# Use WordPress built-in cron (false) or system cron (true)
wp_disable_cron: true
wp_cron_interval: "*/5"  # Every 5 minutes when using system cron

# File permissions
site_dir_permissions: "0755"
site_file_permissions: "0644"

# Site tools (elFinder file manager + Adminer) behind WordSail SSO
# Set false to skip deploying the tools entirely
site_tools_enabled: true

# Root directory the file manager manages (the site's WordPress files)
filemanager_root: "{{ site_home }}/files"

# Panel SSO authority
wordsail_sso_server: "managed.wordsail.com"

# elFinder file manager. Installed once per server, root-owned, outside every
# site directory (so site users never see it over SSH/SFTP); each site only
# gets an SSO-guarded entry point. The clone is checked against the commit.
elfinder_version: "2.1.70"
elfinder_commit: "e7ea668fd569fc9903fb1c431d47d58f2daad2f2"
elfinder_repo: "https://github.com/Studio-42/elFinder.git"
elfinder_base: "/opt/pressctl/elfinder"
elfinder_home: "{{ elfinder_base }}/{{ elfinder_version }}"

# jQuery and jQuery UI for elFinder's browser UI (the versions elFinder targets)
elfinder_jquery_version: "4.0.0"
elfinder_jquery_url: "https://registry.npmjs.org/jquery/-/jquery-4.0.0.tgz"
elfinder_jquery_sha256: "7ac123e4992439dc6a966cb4444fceb7f4698db94904a1256df542d5deb80f59"
elfinder_jquery_ui_version: "1.14.2"
elfinder_jquery_ui_url: "https://registry.npmjs.org/jquery-ui/-/jquery-ui-1.14.2.tgz"
elfinder_jquery_ui_sha256: "8f021edc451532d858f438eff47780b646df4fb36d2a7232eedb35c38bc6a244"

# Pinned tool downloads
adminer_url: "https://github.com/vrana/adminer/releases/download/v6.0.1/adminer-6.0.1.php"
adminer_sha256: "1815c03f26e21d533e729c0b09bc69a59c902a6440409d013105ee679dff006c"
