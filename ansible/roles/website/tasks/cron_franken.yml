---
# wp-cron for the FrankenPHP stack.
#   native : runs as the frankenphp user via the wp-franken wrapper.
#   docker : runs as root and invokes WP-CLI inside the container.

- name: Ensure wp-cron job for {{ domain }} (frankenphp native)
  ansible.builtin.cron:
    name: "wp-cron-{{ domain }}"
    minute: "2,7,12,17,22,27,32,37,42,47,52,57"
    job: >-
      cd {{ site_home }}/files &&
      {{ frankenphp_wp_wrapper | default('/usr/local/bin/wp-franken') }}
      cron event run --due-now --quiet
    user: "{{ frankenphp_user | default('frankenphp') }}"
    state: present
  when: frankenphp_runtime | default('native') == 'native'

- name: Ensure wp-cron job for {{ domain }} (frankenphp docker)
  ansible.builtin.cron:
    name: "wp-cron-{{ domain }}"
    minute: "2,7,12,17,22,27,32,37,42,47,52,57"
    job: >-
      docker compose -f /etc/frankenphp/docker-compose.yml exec -T
      -e PHP_INI_SCAN_DIR={{ frankenphp_docker_ini_scan_dir | default('/usr/local/etc/php/conf.d') }}
      -w /sites/{{ domain }}/files frankenphp
      wp cron event run --due-now --quiet --allow-root
    user: root
    state: present
  when: frankenphp_runtime | default('native') == 'docker'
