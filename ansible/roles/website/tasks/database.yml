---
- name: Create MySQL database
  community.mysql.mysql_db:
    name: '{{ db_name }}'
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_520_ci
    login_host: "{{ db_host.split(':')[0] }}"
    login_port: "{{ db_host.split(':')[1] | default('3306') }}"
    config_file: /home/pressctl/.my.cnf

# For FrankenPHP the WordPress runtime is a Docker container that connects over
# the host gateway, so the user must be allowed from the Docker bridge subnet
# (172.16.0.0/12). For the traditional stack it stays loopback-only.
- name: Create MySQL user
  community.mysql.mysql_user:
    name: '{{ db_user }}'
    password: '{{ db_pass }}'
    priv: '{{ db_name }}.*:ALL'
    host: "{{ '172.%' if (stack | default('traditional') == 'frankenphp') else 'localhost' }}"
    state: present
    login_host: "{{ db_host.split(':')[0] }}"
    login_port: "{{ db_host.split(':')[1] | default('3306') }}"
    config_file: /home/pressctl/.my.cnf
