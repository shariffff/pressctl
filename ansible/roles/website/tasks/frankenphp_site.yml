---
# FrankenPHP site config: drop a per-domain Caddy snippet and reload the shared
# FrankenPHP runtime so it picks up the new site. TLS is automatic via Caddy.
# Works for both runtimes (native systemd binary / docker container).

- name: Set FrankenPHP runtime facts
  ansible.builtin.set_fact:
    fp_runtime: "{{ frankenphp_runtime | default('native') }}"
    fp_sites_dir: /etc/frankenphp/sites
    # Command used to reload the runtime after a config change. The native deb
    # unit supports a graceful (zero-downtime) reload; docker needs a restart.
    fp_reload_cmd: >-
      {{
        'systemctl reload ' ~ (frankenphp_systemd_unit | default('frankenphp'))
        if (frankenphp_runtime | default('native') == 'native')
        else ('docker compose -f /etc/frankenphp/docker-compose.yml restart frankenphp')
      }}

# logs/ must be writable too: Caddy opens the per-site access log as this user.
# (The docker runtime writes as container root, so no chown is needed there.)
- name: Give the FrankenPHP user ownership of the site files and logs (native runtime)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ frankenphp_user | default('frankenphp') }}"
    group: "{{ frankenphp_group | default('frankenphp') }}"
    mode: "0755"
  loop:
    - "{{ site_home }}/files"
    - "{{ site_home }}/logs"
  when: fp_runtime == 'native'

- name: Deploy Caddy site config for {{ domain }}
  ansible.builtin.template:
    src: site.caddy.j2
    dest: "{{ fp_sites_dir }}/{{ domain }}.caddy"
    owner: root
    group: root
    mode: "0644"
  register: fp_site_config

- name: Reload FrankenPHP to apply site config
  ansible.builtin.command:
    cmd: "{{ fp_reload_cmd }}"
  changed_when: true
  when: fp_site_config is changed
