---
# Website Role - Site Tools
# Deploys an SSO-guarded elFinder file manager and Adminer, reached via
# dedicated nginx location blocks. Access is gated by the shared SSO guard.
#
# elFinder's code is installed once per server under {{ elfinder_base }}
# (root-owned, read-only to PHP, outside every site directory). Each site only
# gets its guarded entry point and private scratch space in {{ site_home }}/tools,
# which the SSH/SFTP sandbox hides from the site user.

# ── elFinder, shared by every site on the server ──
- name: Install git (used to fetch elFinder)
  ansible.builtin.apt:
    name: git
    state: present

- name: Create the elFinder directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ elfinder_base }}"
    - "{{ elfinder_base }}/vendor"
    - "{{ elfinder_base }}/vendor/jquery-{{ elfinder_jquery_version }}"
    - "{{ elfinder_base }}/vendor/jquery-ui-{{ elfinder_jquery_ui_version }}"

- name: Fetch elFinder {{ elfinder_version }}
  ansible.builtin.git:
    repo: "{{ elfinder_repo }}"
    dest: "{{ elfinder_home }}"
    version: "{{ elfinder_version }}"
    depth: 1
    single_branch: true
    # Each version gets its own directory, so fetch once and never touch it
    # again (re-running the git module on a shallow tag checkout also fails).
    update: false
    umask: "0022"
  register: elfinder_checkout

# The tag is a name anyone with push access could move; the commit is not.
- name: Check that elFinder is the expected release
  ansible.builtin.assert:
    that: elfinder_checkout.after == elfinder_commit
    fail_msg: >-
      elFinder {{ elfinder_version }} resolved to {{ elfinder_checkout.after }},
      expected {{ elfinder_commit }}. Refusing to use it.
    quiet: true

- name: Download jQuery and jQuery UI for elFinder
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ elfinder_base }}/vendor/{{ item.name }}.tgz"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ item.sha256 }}"
  loop: &elfinder_vendor
    - name: "jquery-{{ elfinder_jquery_version }}"
      url: "{{ elfinder_jquery_url }}"
      sha256: "{{ elfinder_jquery_sha256 }}"
    - name: "jquery-ui-{{ elfinder_jquery_ui_version }}"
      url: "{{ elfinder_jquery_ui_url }}"
      sha256: "{{ elfinder_jquery_ui_sha256 }}"
  loop_control:
    label: "{{ item.name }}"

- name: Unpack jQuery and jQuery UI
  ansible.builtin.unarchive:
    src: "{{ elfinder_base }}/vendor/{{ item.name }}.tgz"
    dest: "{{ elfinder_base }}/vendor/{{ item.name }}"
    remote_src: true
    extra_opts: ["--strip-components=1", "--no-same-owner"]
    creates: "{{ elfinder_base }}/vendor/{{ item.name }}/package.json"
  loop: *elfinder_vendor
  loop_control:
    label: "{{ item.name }}"

# ── Per-site tools ──

- name: Create site tools directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ site_user }}"
    group: "{{ site_group }}"
    mode: "0700"
  loop:
    - "{{ site_home }}/tools"
    - "{{ site_home }}/tools/filemanager"
    - "{{ site_home }}/tools/filemanager/.tmp"
    - "{{ site_home }}/tools/files"

# Sites created before the switch to elFinder carry Tiny File Manager here.
- name: Remove Tiny File Manager
  ansible.builtin.file:
    path: "{{ site_home }}/tools/filemanager/lib"
    state: absent

- name: Download Adminer
  ansible.builtin.get_url:
    url: "{{ adminer_url }}"
    dest: "{{ site_home }}/tools/adminer-6.0.1.php"
    owner: "{{ site_user }}"
    group: "{{ site_group }}"
    mode: "0644"
    checksum: "sha256:{{ adminer_sha256 }}"
  become: true

- name: Deploy shared SSO guard
  ansible.builtin.template:
    src: sso-guard.php.j2
    dest: "{{ site_home }}/tools/sso-guard.php"
    owner: "{{ site_user }}"
    group: "{{ site_group }}"
    mode: "0644"

# HMAC key for the SSO session cookie. Must be readable only by the site
# user (PHP-FPM), never world-readable, and never served by nginx.
- name: Deploy SSO cookie secret
  ansible.builtin.copy:
    content: "{{ sso_secret }}"
    dest: "{{ site_home }}/tools/.sso-secret"
    owner: "{{ site_user }}"
    group: "{{ site_group }}"
    mode: "0600"
  no_log: true

- name: Deploy the file manager's SSO-guarded entry point
  ansible.builtin.template:
    src: elfinder-index.php.j2
    dest: "{{ site_home }}/tools/filemanager/index.php"
    owner: "{{ site_user }}"
    group: "{{ site_group }}"
    mode: "0644"

- name: Deploy Adminer SSO entry
  ansible.builtin.template:
    src: adminer.php.j2
    dest: "{{ site_home }}/tools/adminer.php"
    owner: "{{ site_user }}"
    group: "{{ site_group }}"
    mode: "0644"

# The site database password must not be world-readable, but the site's
# PHP-FPM pool runs as {{ site_user }} so it has to be readable by that user.
# 0600 inside the non-web-accessible tools dir satisfies both.
- name: Deploy Adminer database credentials
  ansible.builtin.template:
    src: db-creds.php.j2
    dest: "{{ site_home }}/tools/.db-creds.php"
    owner: "{{ site_user }}"
    group: "{{ site_group }}"
    mode: "0600"
  no_log: true

- name: Drop nginx locations for site tools
  ansible.builtin.template:
    src: tools-locations.conf.j2
    dest: "/etc/nginx/sites-available/{{ domain }}/server/tools-locations.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
