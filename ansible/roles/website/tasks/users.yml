---
- name: Create site-space group
  ansible.builtin.group:
    name: "{{ site_group }}"
    state: present

- name: Create site-space user
  ansible.builtin.user:
    name: "{{ site_user }}"
    group: "{{ site_group }}"
    home: "{{ site_home }}"
    shell: /usr/local/bin/pressctl-shell
    create_home: true
    state: present

- name: Cap the memory and tasks of the site user's logins
  ansible.builtin.command: "/usr/local/sbin/pressctl-login-limits {{ site_user }}"
  changed_when: false
  failed_when: false  # servers without the security role's helper still create the site
