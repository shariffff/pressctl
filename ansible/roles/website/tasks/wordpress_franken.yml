---
# WordPress install for the FrankenPHP stack. The database is always the host
# MariaDB; how WP-CLI is invoked depends on the runtime:
#   native : the wp-franken wrapper (wp.phar via the FrankenPHP PHP runtime),
#            run as the frankenphp user.
#   docker : WP-CLI inside the container, DB reached over the host gateway.

- name: Dispatch WordPress install (native runtime)
  ansible.builtin.include_tasks: wordpress_franken_native.yml
  when: frankenphp_runtime | default('native') == 'native'

- name: Dispatch WordPress install (docker runtime)
  ansible.builtin.include_tasks: wordpress_franken_docker.yml
  when: frankenphp_runtime | default('native') == 'docker'
