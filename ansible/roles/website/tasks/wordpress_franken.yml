---
# WordPress install for the FrankenPHP stack. WP-CLI runs *inside* the
# container (which bundles wp + the PHP runtime); the database is the host
# MariaDB, reached over the Docker host gateway.

- name: Set FrankenPHP WP-CLI exec prefix
  ansible.builtin.set_fact:
    # -T disables pseudo-TTY allocation (required under Ansible/non-interactive)
    fp_wp: "docker compose -f /etc/frankenphp/docker-compose.yml exec -T -w /sites/{{ domain }}/files frankenphp wp"
    # Database host as seen from *inside* the container
    fp_db_host: host.docker.internal

- name: Download WordPress core
  ansible.builtin.command: "{{ fp_wp }} core download --allow-root"
  args:
    creates: "{{ site_home }}/files/wp-includes/version.php"

- name: Create wp-config.php
  ansible.builtin.command: >
    {{ fp_wp }} config create
    --dbhost='{{ fp_db_host }}'
    --dbname={{ db_name }}
    --dbuser={{ db_user }}
    --dbpass={{ db_pass }}
    --dbprefix={{ db_prefix }}
    --dbcharset=utf8mb4
    --allow-root
  args:
    creates: "{{ site_home }}/files/wp-config.php"

- name: Check if WordPress is installed
  ansible.builtin.command: "{{ fp_wp }} core is-installed --allow-root"
  register: wp_installed
  failed_when: false
  changed_when: false

- name: Install WordPress
  ansible.builtin.command: >
    {{ fp_wp }} core install
    --url=https://{{ domain }}
    --title='Site Title'
    --admin_user='{{ admin_user }}'
    --admin_email='{{ admin_email }}'
    --admin_password='{{ admin_password }}'
    --skip-email
    --allow-root
  when: wp_installed.rc != 0

- name: Get current permalink structure
  ansible.builtin.command: "{{ fp_wp }} option get permalink_structure --allow-root"
  register: current_permalink
  changed_when: false
  failed_when: false

- name: Set permalink structure
  ansible.builtin.command: "{{ fp_wp }} rewrite structure '/%postname%/' --allow-root"
  when: current_permalink.stdout != '/%postname%/'

- name: Flush cache
  ansible.builtin.command: "{{ fp_wp }} cache flush --allow-root"
  changed_when: false
