---
# WordPress install — FrankenPHP native runtime. WP-CLI runs as the frankenphp
# user via the wp-franken wrapper (wp.phar with the php-zts CLI, sharing php.ini
# and extensions with the server). The database is the host MariaDB over loopback.

- name: Set FrankenPHP WP-CLI facts
  ansible.builtin.set_fact:
    fp_wp: "{{ frankenphp_wp_wrapper | default('/usr/local/bin/wp-franken') }}"
    fp_wp_user: "{{ frankenphp_user | default('frankenphp') }}"
    fp_db_host: localhost

- name: Download WordPress core
  become_user: "{{ fp_wp_user }}"
  ansible.builtin.command: "{{ fp_wp }} core download"
  args:
    chdir: "{{ site_home }}/files"
    creates: "{{ site_home }}/files/wp-includes/version.php"

- name: Create wp-config.php
  become_user: "{{ fp_wp_user }}"
  ansible.builtin.command: >
    {{ fp_wp }} config create
    --dbhost='{{ fp_db_host }}'
    --dbname={{ db_name }}
    --dbuser={{ db_user }}
    --dbpass={{ db_pass }}
    --dbprefix={{ db_prefix }}
    --dbcharset=utf8mb4
  args:
    chdir: "{{ site_home }}/files"
    creates: "{{ site_home }}/files/wp-config.php"

- name: Check if WordPress is installed
  become_user: "{{ fp_wp_user }}"
  ansible.builtin.command: "{{ fp_wp }} core is-installed"
  args:
    chdir: "{{ site_home }}/files"
  register: wp_installed
  failed_when: false
  changed_when: false

- name: Install WordPress
  become_user: "{{ fp_wp_user }}"
  ansible.builtin.command: >
    {{ fp_wp }} core install
    --url=https://{{ domain }}
    --title='Site Title'
    --admin_user='{{ admin_user }}'
    --admin_email='{{ admin_email }}'
    --admin_password='{{ admin_password }}'
    --skip-email
  args:
    chdir: "{{ site_home }}/files"
  when: wp_installed.rc != 0

- name: Get current permalink structure
  become_user: "{{ fp_wp_user }}"
  ansible.builtin.command: "{{ fp_wp }} option get permalink_structure"
  args:
    chdir: "{{ site_home }}/files"
  register: current_permalink
  changed_when: false
  failed_when: false

- name: Set permalink structure
  become_user: "{{ fp_wp_user }}"
  ansible.builtin.command: "{{ fp_wp }} rewrite structure '/%postname%/'"
  args:
    chdir: "{{ site_home }}/files"
  when: current_permalink.stdout != '/%postname%/'

- name: Flush cache
  become_user: "{{ fp_wp_user }}"
  ansible.builtin.command: "{{ fp_wp }} cache flush"
  args:
    chdir: "{{ site_home }}/files"
  changed_when: false
